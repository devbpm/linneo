# Publishes a release to Maven Central when a tag v<version> is pushed.
# Repository secrets: CENTRAL_USERNAME and CENTRAL_TOKEN (a Central Publisher Portal user token),
# GPG_PRIVATE_KEY (ASCII-armoured) and GPG_PASSPHRASE.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Check that the tag matches the project version
        run: |
          version=$(./mvnw -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          test "v${version}" = "${GITHUB_REF_NAME}"
      - run: ./mvnw -B -Prelease deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
