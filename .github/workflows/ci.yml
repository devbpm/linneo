name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      # A failure on one JDK must not cancel, and hide, the result on the other.
      fail-fast: false
      matrix:
        java: [21, 25]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # The Maven Wrapper downloads Maven itself, which the cache of setup-java does not keep: cache it, and retry
      # the download, so that a network hiccup of Maven Central does not fail the build before it starts.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Download Maven
        run: |
          for attempt in 1 2 3; do
            ./mvnw -B --version && exit 0
            sleep $((attempt * 15))
          done
          exit 1
      - name: Build, test and check the Javadoc
        run: ./mvnw -B verify
